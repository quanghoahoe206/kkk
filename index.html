<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Trang web của tôi - CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Element & ID Selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Class Selector -->
    <p class="intro-text">
        Xin chào! Tôi là một lập trình viên đam mê công nghệ, luôn tìm tòi học hỏi các kiến thức mới về phát triển ứng dụng và lập trình web.
    </p>

    <!-- Grouping & Pseudo-classes Selector cho danh sách -->
    <div class="hobbies-container">
        <h2>Sở thích cá nhân</h2>
        <ul id="hobby-list">
            <li class="hobby-item">Đọc sách công nghệ</li>
            <li class="hobby-item">Lập trình ứng dụng</li>
            <li class="hobby-item">Chơi thể thao và rèn luyện sức khỏe</li>
        </ul>
    </div>

    <!-- Pseudo-classes :hover, :active cho button -->
    <button type="button" class="btn-primary" id="btn-click">Nhấn vào đây</button>

</body>
</html>
